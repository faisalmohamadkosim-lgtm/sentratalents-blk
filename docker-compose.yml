services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: blk_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - blk_net
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: blk_nginx
    restart: unless-stopped
    ports:
      - "8085:80"
      - "8444:443"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - blk_net
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: blk_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: blk
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: blk
      MYSQL_PASSWORD: blk_secret
    volumes:
      - blk_dbdata:/var/lib/mysql
    ports:
      - "3312:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - blk_net

  redis:
    image: redis:alpine
    container_name: blk_redis
    restart: unless-stopped
    networks:
      - blk_net

networks:
  blk_net:
    driver: bridge

volumes:
  blk_dbdata:
    driver: local
